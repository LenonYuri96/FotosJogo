<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quem é na Foto? - Jogo Quiz</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Script com defer -->
    <script src="js/app.js" defer></script>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-2 py-md-4">

    <main class="container quiz-container px-2 px-sm-3">

        <!-- TELA 1: APRESENTAÇÃO -->
        <section id="tela-inicio" class="glass-card text-center p-3 p-sm-4 p-md-5">
            <div class="icon-hero mb-2 mb-md-3">👶🔍</div>
            <h1 id="txt-titulo" class="fw-bold mb-2 text-gradient fs-2 fs-md-1">Quem é na Foto?</h1>
            <p id="txt-descricao" class="text-muted-light mb-3 mb-md-4">
                Veja a foto da infância e tente adivinhar quem é essa pessoa hoje!
            </p>

            <div class="features-badge mb-4 d-flex justify-content-center gap-2 flex-wrap">
                <span class="badge badge-pill-custom">
                    <i class="bi bi-shuffle me-1"></i> Ordem Aleatória
                </span>
                <span class="badge badge-pill-custom">
                    <i class="bi bi-check2-circle me-1"></i> 4 Opções
                </span>
            </div>

            <button id="btn-iniciar" class="btn btn-action-glow w-100 py-3 fw-bold">
                <i class="bi bi-play-fill fs-5 me-1"></i> COMEÇAR O JOGO
            </button>
        </section>

        <!-- TELA 2: PÁGINA DO JOGO -->
        <section id="tela-jogo" class="glass-card p-3 p-sm-4 d-none">
            <!-- Topo: Contador de Pergunta & Status Neutro -->
            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                <span class="status-pill" id="indicador-pergunta">
                    <i class="bi bi-card-image me-1"></i> 1 de 19
                </span>
                <span class="status-pill" id="indicador-pontos">
                    <i class="bi bi-patch-question me-1"></i> Adivinhe!
                </span>
            </div>

            <!-- Barra de Progresso Suave -->
            <div class="progress progress-custom mb-3">
                <div id="barra-progresso" class="progress-bar progress-bar-glow" style="width: 0%;"></div>
            </div>

            <!-- Card da Imagem Responsiva -->
            <div class="image-wrapper mb-3 position-relative">
                <img id="foto-exibida" src="" alt="Desafio da Foto" class="img-fluid desafio-img">
                <span id="badge-revelacao" class="badge-feedback d-none"></span>
            </div>

            <!-- Grade com as 4 Opções (Geradas Dinamicamente via JS) -->
            <div id="container-opcoes" class="options-grid mb-3"></div>

            <!-- Botão Avançar -->
            <button id="btn-proxima" class="btn btn-next w-100 py-3 fw-bold d-none">
                Próxima Foto <i class="bi bi-arrow-right-circle-fill ms-2"></i>
            </button>
        </section>

        <!-- TELA 3: RESULTADO (GERADOR DE CARD EM IMAGEM) -->
        <section id="tela-fim" class="glass-card text-center p-3 p-sm-4 d-none">
            <h3 class="fw-bold mb-1 text-gradient fs-4 fs-md-3">Seu Card de Resultado</h3>
            <p class="text-muted-light small mb-3">Veja sua pontuação e compartilhe nas redes sociais!</p>

            <!-- CARD VISUAL PRÉVIA (Renderizado no Canvas) -->
            <div class="card-resultado-wrapper mb-3 d-flex justify-content-center">
                <canvas id="canvas-card" width="1080" height="1350" class="d-none"></canvas>
                <img id="img-resultado-gerada" class="img-fluid rounded-4 shadow-lg" alt="Card Resultado Quiz"
                    style="max-height: 380px; width: 100%; object-fit: contain;">
            </div>

            <!-- Placar Oculto de Suporte -->
            <div class="d-none">
                <span id="placar-final">0/0</span>
                <span id="porcentagem-acerto">0%</span>
                <span id="mensagem-status"></span>
            </div>

            <!-- BOTÕES EXCLUSIVOS PARA COMPARTILHAR -->
            <div class="d-flex flex-column gap-2 mb-3">
                <!-- Compartilhar Imagem Direta (WhatsApp, Stories, Celular) -->
                <button id="btn-share-imagem" class="btn btn-native-share w-100 py-3 fw-bold shadow">
                    <i class="bi bi-share-fill me-2"></i> Compartilhar Imagem
                </button>

                <!-- Baixar Imagem PNG -->
                <button id="btn-download-imagem" class="btn btn-social btn-whatsapp w-100 py-2 fw-bold">
                    <i class="bi bi-download me-2"></i> Salvar / Baixar Imagem
                </button>
            </div>

            <!-- Jogar Novamente -->
            <button id="btn-reiniciar" class="btn btn-outline-light w-100 py-2 rounded-pill">
                <i class="bi bi-arrow-repeat me-1"></i> Jogar Novamente
            </button>
        </section>

    </main>

</body>

</html>
